name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths-ignore: ['docs/**', '*.md']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and test portable application
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BilibiliDownloader-Windows-x64
          path: dist/BilibiliDownloader-Windows-x64.zip
          if-no-files-found: error
      - name: Stage release archive
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: dist/BilibiliDownloader-Windows-x64.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-archive
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/*.zip --title "$TAG" --generate-notes
